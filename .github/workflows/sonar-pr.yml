name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-static-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  webapp:
    name: Build webapp frontend
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build webapp
        working-directory: webapp
        run: |
          npm install --no-audit --no-fund
          npm run build

  trading-service:
    name: Build trading service
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build trading-service
        working-directory: services/trading-service
        run: |
          npm install --no-audit --no-fund
          npm run build

  portfolio-service:
    name: Build portfolio service
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build portfolio-service
        working-directory: services/portfolio-service
        run: |
          npm install --no-audit --no-fund
          npm run build

  market-service:
    name: Build market service
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build market-service
        working-directory: services/market-service
        run: |
          npm install --no-audit --no-fund
          npm run build

  compliance-service:
    name: Build compliance service
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build compliance-service
        working-directory: services/compliance-service
        run: |
          npm install --no-audit --no-fund
          npm run build

  identity-service:
    name: Build identity service
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build identity service
        working-directory: services/identity-service
        run: bash ./mvnw -B -DskipTests package

      - name: Upload identity bytecode
        uses: actions/upload-artifact@v4
        with:
          name: identity-service-classes
          path: services/identity-service/target/classes
          if-no-files-found: error

  sonar:
    name: Analyze code with SonarCloud
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    needs:
      - webapp
      - trading-service
      - portfolio-service
      - market-service
      - compliance-service
      - identity-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download identity bytecode
        uses: actions/download-artifact@v4
        with:
          name: identity-service-classes
          path: services/identity-service/target/classes

      - name: SonarQube Cloud scan
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}

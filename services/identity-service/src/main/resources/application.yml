spring:
  application:
    name: identity-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/nexus}
    username: ${SPRING_DATASOURCE_USERNAME:nexus_user}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      show-sql: true
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8881

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000
  refresh-expiration: 86400000

stripe:
  secret-key: ${STRIPE_SECRET_KEY}
  monthly-price-id: ${STRIPE_MONTHLY_PRICE}
  yearly-price-id: ${STRIPE_YEARLY_PRICE}

frontend-domain: ${FRONTEND_DOMAIN}

logging:
  level:
    com.nexus.identityservice: DEBUG    # tus paquetes
    org.springframework.web: DEBUG      # peticiones HTTP entrantes
    org.springframework.web.servlet.mvc.method.annotation: TRACE  # más detalle
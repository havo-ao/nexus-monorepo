spring:
  datasource:
    url: jdbc:h2:mem:identitydb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

jwt:
  secret: local-test-jwt-secret-with-at-least-32-bytes
  expiration: 86400000
  refresh-expiration: 86400000

stripe:
  secret-key: sk_test_dummy
  monthly-price-id: price_monthly_dummy
  yearly-price-id: price_yearly_dummy

frontend-domain: http://localhost:8100
notification-service-url: http://localhost:8080

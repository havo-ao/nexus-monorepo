name: nexus
services:
  mysql:
    image: mysql:8.4
    container_name: nexus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NEXUS_MYSQL_ROOT_PASSWORD:?Set NEXUS_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: nexus
      MYSQL_USER: nexus_user
      MYSQL_PASSWORD: ${NEXUS_MYSQL_PASSWORD:?Set NEXUS_MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - nexus_mysql_data:/var/lib/mysql

  webapp:
    build:
      context: ../../webapp
      dockerfile: Dockerfile.dev
    container_name: nexus-webapp
    restart: unless-stopped
    ports:
      - "8100:8100"
    environment:
      VITE_API_BASE_URL: http://localhost:8881
      VITE_TRADING_API_BASE_URL: http://localhost:8882
      VITE_MARKET_API_BASE_URL: /market-api
      VITE_PORTFOLIO_API_BASE_URL: /portfolio-api
      VITE_PROXY_API_TARGET: http://identity-service:8881
      VITE_PROXY_MARKET_API_TARGET: http://market-service:8884
      VITE_PROXY_PORTFOLIO_API_TARGET: http://portfolio-service:8883
    volumes:
      - ../../webapp:/app
      - /app/node_modules
    depends_on:
      - identity-service
      - trading-service
      - portfolio-service
      - market-service
      - compliance-service

  identity-service:
    build:
      context: ../../services/identity-service
      dockerfile: Dockerfile.dev
    container_name: nexus-identity-service
    restart: unless-stopped
    ports:
      - "8881:8881"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/nexus}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-nexus_user}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-${NEXUS_MYSQL_PASSWORD:?Set NEXUS_MYSQL_PASSWORD}}
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?Set NEXUS_JWT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_YEARLY_PRICE: ${STRIPE_YEARLY_PRICE}
      STRIPE_MONTHLY_PRICE: ${STRIPE_MONTHLY_PRICE}
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN}
      NOTIFICATION_SERVICE_URL: ${NOTIFICATION_SERVICE_URL}
    volumes:
      - ../../services/identity-service:/app
      - /root/.m2
    depends_on:
      - mysql
      - compliance-service
    command: >
      sh -c "chmod +x mvnw &&
      ./mvnw spring-boot:run"

  trading-service:
    build:
      context: ../../services/trading-service
      dockerfile: Dockerfile.dev
    container_name: nexus-trading-service
    restart: unless-stopped
    ports:
      - "8882:8882"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: nexus_user
      DB_PASSWORD: ${NEXUS_MYSQL_PASSWORD:?Set NEXUS_MYSQL_PASSWORD}
      DB_DATABASE: nexus
      ALPACA_BROKER_MODE: ${ALPACA_BROKER_MODE:-mock}
      ALPACA_API_BASE_URL: ${ALPACA_API_BASE_URL:-https://paper-api.alpaca.markets}
      ALPACA_API_KEY: ${ALPACA_API_KEY:-}
      ALPACA_SECRET_KEY: ${ALPACA_SECRET_KEY:-}
      ALPACA_TIMEOUT_MS: ${ALPACA_TIMEOUT_MS:-5000}
      PORTFOLIO_SERVICE_URL: http://portfolio-service:8883
      NOTIFICATION_SERVICE_URL: http://compliance-service:8885
    volumes:
      - ../../services/trading-service:/app
      - /app/node_modules
    depends_on:
      - mysql
      - portfolio-service
      - compliance-service
    command: >
      sh -c "npm run db:migrate &&
      npm run start:dev"

  portfolio-service:
    build:
      context: ../../services/portfolio-service
      dockerfile: Dockerfile.dev
    container_name: nexus-portfolio-service
    restart: unless-stopped
    ports:
      - "8883:8883"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: nexus_user
      DB_PASSWORD: ${NEXUS_MYSQL_PASSWORD:?Set NEXUS_MYSQL_PASSWORD}
      DB_DATABASE: nexus
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:?Set NEXUS_JWT_SECRET}
      MARKET_SERVICE_BASE_URL: http://market-service:8884
    depends_on:
      - mysql
      - market-service
    volumes:
      - ../../services/portfolio-service:/app
      - /app/node_modules
    command: >
      sh -c "npm run db:migrate &&
      npm run start:dev"

  market-service:
    build:
      context: ../../services/market-service
      dockerfile: Dockerfile.dev
    container_name: nexus-market-service
    restart: unless-stopped
    ports:
      - "8884:8884"
    environment:
      MARKET_HOURS_REPOSITORY: mysql
      MARKET_DATA_PROVIDER: ${MARKET_DATA_PROVIDER:-}
      MARKET_HISTORY_PROVIDER: ${MARKET_HISTORY_PROVIDER:-}
      INSTRUMENT_CATALOG_PROVIDER: ${INSTRUMENT_CATALOG_PROVIDER:-}
      INSTRUMENT_METADATA_PROVIDER: ${INSTRUMENT_METADATA_PROVIDER:-}
      MARKETS_REPOSITORY: mysql
      INSTRUMENTS_REPOSITORY: mysql
      QUOTES_REPOSITORY: mysql
      WATCHLISTS_REPOSITORY: mysql
      PRICE_ALERTS_REPOSITORY: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: nexus
      MYSQL_USER: nexus_user
      MYSQL_PASSWORD: ${NEXUS_MYSQL_PASSWORD:?Set NEXUS_MYSQL_PASSWORD}
      ALPHA_VANTAGE_API_KEY: ${ALPHA_VANTAGE_API_KEY:-}
      ALPHA_VANTAGE_BASE_URL: ${ALPHA_VANTAGE_BASE_URL:-https://www.alphavantage.co/query}
      ALPHA_VANTAGE_HISTORY_OUTPUT_SIZE: ${ALPHA_VANTAGE_HISTORY_OUTPUT_SIZE:-compact}
      ALPHA_VANTAGE_INSTRUMENT_LIMIT: ${ALPHA_VANTAGE_INSTRUMENT_LIMIT:-500}
      ALPHA_VANTAGE_LISTING_STATE: ${ALPHA_VANTAGE_LISTING_STATE:-active}
      ALPHA_VANTAGE_TIMEOUT_MS: ${ALPHA_VANTAGE_TIMEOUT_MS:-5000}
      MARKET_DATA_SYNC_ON_STARTUP: ${MARKET_DATA_SYNC_ON_STARTUP:-true}
      MARKET_DATA_SYNC_SYMBOLS: ${MARKET_DATA_SYNC_SYMBOLS:-AAPL,MSFT,TSLA,GOOGL,AMZN,NVDA,META}
    volumes:
      - ../../services/market-service:/app
      - /app/node_modules
    depends_on:
      - mysql
    command: >
      sh -c "npm run db:migrate &&
      npm run start:dev"

  compliance-service:
    build:
      context: ../../services/compliance-service
      dockerfile: Dockerfile.dev
    container_name: compliance-service
    restart: unless-stopped
    ports:
      - "8885:8885"
    environment:
      MAIL_HOST: ${MAIL_HOST:?Set MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT:?Set MAIL_PORT}
      MAIL_SECURE: ${MAIL_SECURE:-false}
      MAIL_USER: ${MAIL_USER:?Set MAIL_USER}
      MAIL_PASS: ${MAIL_PASS:?Set MAIL_PASS}
      MAIL_FROM: ${MAIL_FROM:?Set MAIL_FROM}
    volumes:
      - ../../services/compliance-service:/app
      - /app/node_modules
    depends_on:
      - mysql
    command: >
      npm run start:dev

volumes:
  nexus_mysql_data:
